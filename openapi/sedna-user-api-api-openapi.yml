      operationId: addUserRoleRelationships
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRelToMany'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRelToMany'
      responses:
        default:
          content:
            application/json: {}
            application/vnd.api+json: {}
          description: default response
      tags:
      - User API
    delete:
      description: 'Remove roles from User


        Required API Permissions: USER_WRITE'
      operationId: removeUserRoleRelationships
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRelToMany'
          application/vnd.api+json:
            schema:
