openapi: 3.0.1
info:
  contact:
    name: Support
    url: https://support.sedna.com
  termsOfService: https://www.sedna.com/terms-of-service
  title: Sedna Authentication User API API
  version: '2019-01-01'
servers:
- description: Platform endpoint
  url: https://{tenant}.sednanetwork.com/platform
  variables:
    tenant:
      default: example
      description: Your tenant's unique identifier
security:
- Basic: []
- OAuth: []
tags:
- name: User API
paths:
  /2019-01-01/user:
    post:
      description: 'Create a user


        Required API Permissions: USER_WRITE'
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingle'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserSingle'
          description: default response
      tags:
      - User API
    get:
      description: 'Fetch a collection of users


        Required API Permissions: USER_READ'
      operationId: list_1
      parameters:
      - in: query
        name: page[limit]
        schema:
          type: integer
          format: int64
          default: 100
      - in: query
        name: page[offset]
        schema:
          type: integer
          format: int64
          default: 0
      - in: query
        name: include
        schema:
          type: string
      - in: query
        name: fields[user]
        schema:
          type: string
      - in: query
        name: filter[user.ssoEmail]
        schema:
          type: string
      - example: 3,5,7
        in: query
        name: filter[user.id]
        schema:
          type: string
      - deprecated: true
        in: query
        name: ssoEmail
        schema:
          type: string
      - in: query
        name: filter[user.firstName]
        schema:
          type: string
      - in: query
        name: filter[user.lastName]
        schema:
          type: string
      - in: query
        name: sortBy
        schema:
          type: string
          enum:
          - username.asc
          - username.desc
          - firstName.asc
          - firstName.desc
          - lastName.asc
          - lastName.desc
          - initials.asc
          - initials.desc
          - ssoEmail.asc
          - ssoEmail.desc
          - lastLogin.asc
          - lastLogin.desc
          - createdAt.asc
          - createdAt.desc
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollection'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserCollection'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}:
    delete:
      description: 'Delete a user


        Required API Permissions: USER_DELETE'
      operationId: delete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json: {}
            application/vnd.api+json: {}
          description: default response
      tags:
      - User API
    get:
      description: 'Fetch a user


        Required API Permissions: USER_READ'
      operationId: find_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: include
        schema:
          type: string
      - in: query
        name: fields[user]
        schema:
          type: string
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingle'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserSingle'
          description: default response
      tags:
      - User API
    patch:
      description: 'Update a user


        Required API Permissions: USER_WRITE'
      operationId: update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingle'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserSingle'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/default-team:
    get:
      description: 'Retrieve a user''s primary/default team


        Required API Permissions: USER_READ, TEAM_READ'
      operationId: getUserDefaultTeam
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSingle'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamSingle'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/disable-send-teams:
    get:
      description: "\nFetch the teams that have sending disabled for the given user.\n\n**This is an enterprise feature.** If you'd like to learn more, please reach out to your account representative.\n    \n\nRequired API Permissions: USER_READ, TEAM_READ"
      operationId: getUserDisableSendTeams
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCollection'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamCollection'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/job-reference:
    get:
      description: 'Get a users job reference subscriptions


        Required API Permissions: USER_READ, JOBREFERENCE_READ'
      operationId: getUserJobReferenceSubscriptions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJobReferenceCollection'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserJobReferenceCollection'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/notification-device:
    get:
      description: 'Fetch a user''s related notification devices


        Required API Permissions: USER_READ'
      operationId: getUserNotificationDevices
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDeviceCollection'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotificationDeviceCollection'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/relationships/default-team:
    get:
      description: 'Retrieve relationship information for a user''s default team - the default team is always ''watched''


        Required API Permissions: USER_READ'
      operationId: getUserDefaultTeamRelationship
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRelationship'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamRelationship'
          description: default response
      tags:
      - User API
    patch:
      description: 'Set a user''s default or primary team


        Required API Permissions: USER_WRITE'
      operationId: setUserDefaultTeamRelationship
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelationship'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelationship'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRelationship'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamRelationship'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/relationships/disable-send-teams:
    post:
      description: '

        Disable sending for a team for the given user.

        Sending cannot be disabled for a user''s default team.


        **This is an enterprise feature.** If you''d like to learn more, please reach out to your account representative.



        Required API Permissions: USER_WRITE'
      operationId: addUserDisableSendTeamsRelationships
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelToMany'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelToMany'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
          description: default response
      tags:
      - User API
    get:
      description: "\nFetch the team relationships that have sending disabled for the given user.\n\n**This is an enterprise feature.** If you'd like to learn more, please reach out to your account representative.\n    \n\nRequired API Permissions: USER_READ"
      operationId: getUserDisableSendTeamsRelationships
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
          description: default response
      tags:
      - User API
    delete:
      description: '

        Turn off disable sending for a team for the given user. (ie. Enable sending)


        **This is an enterprise feature.** If you''d like to learn more, please reach out to your account representative.



        Required API Permissions: USER_WRITE'
      operationId: removeUserDisableSendTeamsRelationships
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelToMany'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelToMany'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/relationships/job-reference:
    get:
      description: 'Get a users job reference relationships


        Required API Permissions: USER_READ'
      operationId: getUserJobReferenceSubscriptionRelationships
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: filter[createdBy]
        schema:
          type: string
          enum:
          - api
          - ui
          - '{userId}'
          example: api
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReferenceRelToMany'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JobReferenceRelToMany'
          description: default response
      tags:
      - User API
    post:
      description: 'Subscribe a user to a job reference


        Required API Permissions: USER_WRITE'
      operationId: subscribeToJobReferences
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - description: allow user to manage this subscription
        in: query
        name: managedByUser
        schema:
          type: boolean
          default: false
          enum:
          - true
          - false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobReferenceRelToMany'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/JobReferenceRelToMany'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReferenceRelToMany'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JobReferenceRelToMany'
          description: default response
      tags:
      - User API
    delete:
      description: 'Unsubscribe a user to a job reference


        Required API Permissions: USER_WRITE'
      operationId: unsubscribeToJobReferences
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobReferenceRelToMany'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/JobReferenceRelToMany'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReferenceRelToMany'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JobReferenceRelToMany'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/relationships/keyword:
