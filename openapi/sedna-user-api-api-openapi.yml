  /2019-01-01/user/{id}/relationships/watched-teams:
    post:
      description: 'Add a watched team to a user - the user must already be able to access the team


        Required API Permissions: USER_WRITE'
      operationId: addUserWatchedTeamsRelationships
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelToMany'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelToMany'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
          description: default response
      tags:
      - User API
    get:
      description: 'Retrieve relationship data for a user''s watched teams - watched teams'' mail appears in a user''s inbox


        Required API Permissions: USER_READ'
      operationId: getUserWatchedTeamsRelationships
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
          description: default response
      tags:
      - User API
    delete:
      description: 'Remove a watched team or teams from a user''s watched list - the user must be able to access the teams already


        Required API Permissions: USER_WRITE'
      operationId: removeUserWatchedTeamsRelationships
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelToMany'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRelToMany'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamRelToMany'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/team:
    get:
      description: 'Fetch a user''s related teams


        Required API Permissions: USER_READ, TEAM_READ'
      operationId: getUserTeams
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCollection'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamCollection'
          description: default response
      tags:
      - User API
  /2019-01-01/user/{id}/watched-teams:
    get:
      description: 'Retrieve the teams the user is currently ''watching'' - watched teams'' mail will appear in the user''s inbox


        Required API Permissions: USER_READ, TEAM_READ'
      operationId: getUserWatchedTeams
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCollection'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamCollection'
          description: default response
      tags:
      - User API
components:
  schemas:
    UpdateTeamRelToMany:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamRelData'
    TeamRelToMany:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamRelData'
        links:
          $ref: '#/components/schemas/TeamRelLinks'
    Meta:
      type: object
      properties:
        disableSend:
          type: boolean
        watched:
          type: boolean
    EventId:
      type: object
      properties:
        id:
          type: integer
          format: int64
    UserRelData:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
    NotificationDeviceRelLinks:
      type: object
      properties:
        related:
          type: string
        self:
          type: string
    TeamResource:
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/TeamAttributes'
        id:
          type: string
        links:
          $ref: '#/components/schemas/TeamLinks'
        relationships:
          $ref: '#/components/schemas/TeamRelationships'
        type:
          type: string
          description: the type of the resource
          enum:
          - team
        uuid:
          type: string
    SoloInboxCreate:
      type: object
      properties:
        additionalEmailAddresses:
          type: array
          items:
            type: string
