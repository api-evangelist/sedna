        Required API Permissions: USER_WRITE'
      operationId: subscribeUserToKeyword
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeywordRelToMany'
          application/vnd.api+json:
