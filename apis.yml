name: SEDNA
description: SEDNA is the operating system for shipping — a communications and workflow platform that
  unifies email, voyage and trade operations, and document handling for maritime, commodity trading and
  logistics teams. Its API (version 2019-01-01) exposes messages, contacts, teams, users, job references,
  category tags, events and workflows over a JSON:API-style REST interface secured with OAuth 2.0 client-credentials,
  letting developers automate inbox routing, tagging, subscriptions and third-party integrations. Backed
  by Insight Partners.
